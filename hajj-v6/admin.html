<!doctype html><html lang="ar"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>لوحة الأدمن</title><link rel="stylesheet" href="styles.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script></head><body><div class="toast" id="toast"></div><main class="wrap"><section class="hero header-hero admin-dashboard-hero">
  <div class="admin-hero-row">
    <div class="admin-title-wrap">
      <img src="R.png" class="logo admin-logo">
      <h1 class="hero2">لوحة متابعة الطلبات</h1>
    </div>

    <div class="header-actions admin-actions">
      <a class="link" href="qrcodes.html">QR الغرف</a>
      <a class="link" href="index.html">صفحة الخدمات</a>
    </div>
  </div>
</section><section class="panel" id="loginBox"><h2>تسجيل دخول الأدمن</h2><label>اسم المستخدم</label><input id="username" value="admin"><label>كلمة المرور</label><input id="password" type="password" value="1234"><br><br><button class="btn" onclick="login()">دخول</button></section><section id="dash" style="display:none"><div class="stats"><div class="stat"><span>كل الطلبات</span><b id="stAll">0</b></div><div class="stat"><span>طلبات جديدة</span><b id="stNew">0</b></div><div class="stat"><span>تحت الإجراء</span><b id="stProgress">0</b></div><div class="stat"><span>تم التنفيذ</span><b id="stDone">0</b></div></div><section class="panel"><div class="top"><h2>الطلبات</h2><button class="btn secondary" onclick="loadRequests()">تحديث</button></div><div class="toolbar"><input id="search" oninput="renderRequests()" placeholder="بحث بالغرفة أو الخدمة أو التفاصيل"><select id="filter" onchange="renderRequests()"><option value="">كل الحالات</option><option>جديد</option><option>تحت الإجراء</option><option>تم التنفيذ</option><option>ملغي</option></select><button class="btn blue" onclick="enableSound()">تفعيل صوت التنبيه</button></div><div style="overflow:auto"><table><thead><tr><th>الوقت</th><th>الغرفة</th><th>الخدمة</th><th>التفاصيل</th><th>الحالة</th><th>إجراء</th></tr></thead><tbody id="requests"></tbody></table></div></section></section></main><script src="admin.js"></script></body></html>
