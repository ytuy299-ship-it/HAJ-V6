<!doctype html><html lang="ar"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>QR الغرف</title><link rel="stylesheet" href="styles.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><style>@media print{.no-print,.hero{display:none!important}.wrap{max-width:none;padding:0}.qr-grid{gap:12px}.qr-card{break-inside:avoid;box-shadow:none;border:2px solid #222}.qr-card img{width:170px;height:170px}}.qr-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:18px;margin-top:24px}.qr-card{text-align:center;background:white;border:1px solid var(--line);border-radius:28px;padding:22px;box-shadow:var(--shadow)}.qr-card img{width:190px;height:190px}.qr-card h2{margin:8px 0}.qr-url{font-size:12px;color:var(--muted);word-break:break-all;direction:ltr}</style></head><body><main class="wrap"><section class="hero"><div class="top"><div><h1>رموز QR للغرف</h1></div><div class="no-print" style="display:flex;gap:10px;flex-wrap:wrap"><button class="btn" onclick="window.print()">طباعة</button><a class="link" href="admin.html">لوحة الأدمن</a><a class="link" href="index.html">صفحة الخدمات</a></div></div></section><div class="panel no-print"><label>رابط الموقع المستخدم في QR</label><input id="baseUrl"><button class="btn" onclick="render()">تحديث الرموز</button></div><section class="qr-grid" id="qrGrid"></section></main><script>const client=supabase.createClient(window.SUPABASE_URL,window.SUPABASE_ANON_KEY);const $=id=>document.getElementById(id);let rooms=[];function qrSrc(url){return 'https://api.qrserver.com/v1/create-qr-code/?size=420x420&data='+encodeURIComponent(url)}async function load(){ $('baseUrl').value=location.origin+'/'; const {data,error}=await client.from('rooms').select('*').order('id').limit(4); rooms=(data&&data.length?data:[{room_num:'101'},{room_num:'202'},{room_num:'305'},{room_num:'410'}]); render()}function render(){const base=$('baseUrl').value.replace(/\?+$/,'');$('qrGrid').innerHTML=rooms.map(r=>{const num=r.room_num||r.roomnum||r.name||r.id;const url=base+'?room='+encodeURIComponent(num);return `<div class="qr-card"><h2>غرفة ${num}</h2><img alt="QR غرفة ${num}" src="${qrSrc(url)}"><p class="qr-url">${url}</p></div>`}).join('')}load();</script></body></html>
